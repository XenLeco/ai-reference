# Mention-driven OpenCode assistant: comment "/oc <request>" on an issue or PR.
# Same requirements as ai-review.yml (gateway reachable, LITELLM_BASE_URL, LITELLM_CI_KEY).
# Only repository members can trigger it; the check below refuses comments from others.
name: ai-assist

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  assist:
    if: >-
      contains(github.event.comment.body, '/oc') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_CI_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "share": "disabled",
              "enabled_providers": ["litellm"],
              "provider": {
                "litellm": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "LiteLLM Gateway",
                  "options": { "baseURL": "${{ vars.LITELLM_BASE_URL }}/v1", "apiKey": "{env:LITELLM_API_KEY}" },
                  "models": {
                    "coder-fast": { "name": "coder-fast", "limit": { "context": 200000, "output": 32000 }, "tool_call": true, "reasoning": true }
                  }
                }
              }
            }
        with:
          use_github_token: true
          model: litellm/coder-fast
          mentions: /oc,/opencode
