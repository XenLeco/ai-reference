# Enterprise variant of the AI review workflow.
# Differences from templates/project/.github/workflows/ai-review.yml:
#   - runs only on a self-hosted runner inside the network (the gateway is internal)
#   - runs only when a maintainer applies the `ai-review` label (explicit human trigger)
#   - the CI key belongs to a team with a budget; the request is tagged `ci` for spend reports
#   - the action is pinned to a release tag; share is disabled; no write permissions
name: ai-review

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, internal]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OpenCode /review-pr
        uses: anomalyco/opencode/github@vX.Y.Z   # pinned release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_CI_KEY }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "share": "disabled",
              "autoupdate": false,
              "enabled_providers": ["litellm"],
              "provider": {
                "litellm": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Company AI Gateway",
                  "options": {
                    "baseURL": "${{ vars.LITELLM_BASE_URL }}/v1",
                    "apiKey": "{env:LITELLM_API_KEY}",
                    "headers": { "x-litellm-tags": "ci,repo=${{ github.repository }}" }
                  },
                  "models": {
                    "coder-fast": { "name": "coder-fast", "limit": { "context": 131072, "output": 16384 }, "tool_call": true, "reasoning": true }
                  }
                }
              },
              "permission": { "edit": "deny", "bash": { "*": "deny", "git diff*": "allow", "git log*": "allow", "git show*": "allow" }, "webfetch": "deny" }
            }
        with:
          use_github_token: true
          model: litellm/coder-fast
          prompt: /review-pr
